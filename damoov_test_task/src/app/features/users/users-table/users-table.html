<div class="overflow-x-auto">
  <table class="w-full border-collapse text-left text-sm">
    <thead>
      <tr class="border-b border-slate-200 text-xs uppercase tracking-wide text-slate-500">
        <th scope="col" class="px-4 py-3 font-medium">User</th>
        <th scope="col" class="px-4 py-3 font-medium">Email</th>
        <th scope="col" class="px-4 py-3 font-medium">Phone</th>
        <th scope="col" class="px-4 py-3 font-medium">Status</th>
        <th scope="col" class="px-4 py-3 font-medium">Location</th>
        <th scope="col" class="px-4 py-3 font-medium">Created</th>
      </tr>
    </thead>
    <tbody>
      @for (row of rows(); track row.id) {
        <tr class="border-b border-slate-100 transition-colors hover:bg-slate-50">
          <td class="px-4 py-3">
            <div class="font-medium text-slate-900">{{ row.name }}</div>
            <div class="font-mono text-xs text-slate-400">{{ row.id }}</div>
          </td>
          <td class="px-4 py-3 text-slate-700">{{ row.email }}</td>
          <td class="px-4 py-3 text-slate-700">{{ row.phone }}</td>
          <td class="px-4 py-3">
            <span
              class="inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium ring-1 ring-inset"
              [class]="statusClass(row.status)"
            >
              {{ row.status }}
            </span>
          </td>
          <td class="px-4 py-3 text-slate-700">{{ row.location }}</td>
          <td class="px-4 py-3 text-slate-700">{{ row.createdAt }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
